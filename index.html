
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinkMate - Video Link Viewer</title>
<meta name="description" content="Paste a YouTube video or Shorts link to view its thumbnail and open the original video.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff0f6;
    color: #333;
}

header {
    background: #ec4899;
    color: white;
    padding: 22px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
}

.container {
    max-width: 650px;
    margin: 65px auto;
    padding: 25px;
    text-align: center;
}

h1 {
    color: #db2777;
    margin-bottom: 15px;
}

p {
    color: #666;
    margin-bottom: 25px;
    line-height: 1.6;
}

.input-box {
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 2px solid #f9a8d4;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
}

button {
    background: #ec4899;
    color: white;
    border: none;
    padding: 15px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
}

button:hover {
    background: #be185d;
}

#result {
    display: none;
    background: white;
    margin-top: 30px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #fbcfe8;
}

#thumbnail {
    width: 100%;
    border-radius: 12px;
    margin: 15px 0;
}

.watch {
    display: inline-block;
    background: #ec4899;
    color: white;
    text-decoration: none;
    padding: 13px 25px;
    border-radius: 9px;
    margin-top: 12px;
}

#error {
    color: #dc2626;
    margin-top: 15px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}

@media(max-width: 500px) {
    .input-box {
        flex-direction: column;
    }

    .container {
        margin: 35px auto;
    }
}
</style>
</head>

<body>

<header>PinkMate</header>

<div class="container">

    <h1>YouTube Video Viewer</h1>

    <p>
        Paste a YouTube video or Shorts URL below.
        View its thumbnail and open the original video.
    </p>

    <div class="input-box">
        <input
            type="text"
            id="videoURL"
            placeholder="Paste YouTube video URL here..."
        >
        <button onclick="showVideo()">Search</button>
    </div>

    <div id="error"></div>

    <div id="result">
        <h2 id="videoTitle">Your Video</h2>

        <img id="thumbnail" src="" alt="YouTube video thumbnail">

        <p>Your video is ready to watch.</p>

        <a
            id="watchButton"
            class="watch"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
        >
            Watch on YouTube
        </a>
    </div>

</div>

<footer>
    PinkMate | YouTube Link Viewer
</footer>

<script>
function getVideoID(url) {
    try {
        const parsed = new URL(url.trim());

        let id = "";

        if (parsed.hostname === "youtu.be" ||
            parsed.hostname === "www.youtu.be") {
            id = parsed.pathname.split("/")[1];
        }

        else if (
            parsed.hostname === "youtube.com" ||
            parsed.hostname === "www.youtube.com" ||
            parsed.hostname === "m.youtube.com"
        ) {
            if (parsed.pathname === "/watch") {
                id = parsed.searchParams.get("v");
            } else {
                const parts = parsed.pathname.split("/");
                if (["shorts", "embed", "live"].includes(parts[1])) {
                    id = parts[2];
                }
            }
        }

        return /^[a-zA-Z0-9_-]{11}$/.test(id || "")
            ? id
            : null;

    } catch {
        return null;
    }
}

function showVideo() {
    const url = document.getElementById("videoURL").value.trim();
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    error.textContent = "";
    result.style.display = "none";

    const videoID = getVideoID(url);

    if (!videoID) {
        error.textContent = "Please enter a valid YouTube video URL.";
        return;
    }

    const videoURL = "https://www.youtube.com/watch?v=" + videoID;

    document.getElementById("thumbnail").src =
        "https://img.youtube.com/vi/" + videoID + "/hqdefault.jpg";

    document.getElementById("videoTitle").textContent =
        "YouTube Video";

    document.getElementById("watchButton").href = videoURL;

    result.style.display = "block";
}
</script>

</body>
</html>
